[project]
name = "it-outsourcing-knowledge-agent"
version = "0.1.0"
description = "Compact multi-project knowledge and ticket collaboration agent for IT outsourcing delivery."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "langgraph>=1.2.10,<1.3",
  "langgraph-checkpoint-postgres>=3.1.1,<3.2",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "structlog>=25.4,<26.0",
  "uvicorn>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
