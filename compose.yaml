services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: project_agent
      POSTGRES_USER: project_agent
      POSTGRES_PASSWORD: project_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_agent -d project_agent"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - project_agent_postgres_data:/var/lib/postgresql/data

volumes:
  project_agent_postgres_data:
