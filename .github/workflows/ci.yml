name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: project_agent
          POSTGRES_USER: project_agent
          POSTGRES_PASSWORD: project_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U project_agent -d project_agent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://project_agent:project_agent@127.0.0.1:5432/project_agent
      LOCAL_STORAGE_ROOT: ./data
      RAGFLOW_BASE_URL: http://127.0.0.1:9380
      RAGFLOW_API_KEY: replace-me
      RAGFLOW_EXPECTED_VERSION: replace-me
      LLM_BASE_URL: https://api.example.invalid/v1
      LLM_API_KEY: replace-me
      LLM_MODEL_ALIAS: replace-me
      LLM_REQUEST_CAPACITY: 10
      LLM_TOKEN_CAPACITY: 100000
      RUN_POSTGRES_INTEGRATION: "1"
      JWT_HS256_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes
      JWT_ISSUER: project-agent
      JWT_AUDIENCE: project-agent-api
      LANGGRAPH_STRICT_MSGPACK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Validate Task 0
        run: uv run python scripts/validate_task0.py

      - name: Ruff
        run: uv run ruff check src tests

      - name: MyPy
        run: uv run mypy src

      - name: Tests
        run: >-
          uv run pytest
          tests/unit
          tests/integration/api
          tests/integration/db
          tests/integration/identifiers
          tests/integration/jobs
          tests/integration/config
          tests/integration/auth
          tests/integration/agent
          tests/integration/evidence
          tests/integration/issues
          tests/contract
          tests/security
          tests/e2e
          tests/reliability
          -v
